name: Code tests
on:
  pull_request:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ['3.10', '3.14']
        sdk: [minimum, latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '${{ matrix.python }}'
          cache: pip
      - run: python3 -m pip install -r requirements-dev.txt
      - if: matrix.sdk == 'minimum'
        run: python3 -m pip install mcp==1.26.0
      - run: python3 -m pip check
      - run: python3 -m pytest --cov=calibre_mcp --cov-report=term-missing --cov-report=xml --junitxml=test-results.xml
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: tests-${{ matrix.python }}-${{ matrix.sdk }}
          path: |
            coverage.xml
            test-results.xml
