<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 400" width="900" height="400" role="img" aria-label="Conversion sequence: client starts a job on the calibre server, polls status, and the server adds the new format to the book">
  <defs>
    <marker id="b" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#57606a"/>
    </marker>
    <style>
      .t{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif}
      .h{font-size:14px;font-weight:600;fill:#1f2328}
      .m{font-size:11.5px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#0a3069}
      .l{font-size:11.5px;fill:#57606a}
      .ok{font-size:12px;font-weight:600;fill:#1a7f37}
      .box{fill:#ffffff;stroke:#d0d7de;stroke-width:1.5;rx:8}
    </style>
  </defs>
  <rect width="900" height="400" fill="#f6f8fa"/>

  <rect class="box" x="60" y="24" width="210" height="40"/>
  <text class="t h" x="165" y="49" text-anchor="middle">calibre-mcp</text>
  <rect class="box" x="600" y="24" width="240" height="40"/>
  <text class="t h" x="720" y="49" text-anchor="middle">calibre Content Server</text>

  <line x1="165" y1="70" x2="165" y2="352" stroke="#d0d7de" stroke-width="2" stroke-dasharray="4 4"/>
  <line x1="720" y1="70" x2="720" y2="352" stroke="#d0d7de" stroke-width="2" stroke-dasharray="4 4"/>

  <line x1="165" y1="104" x2="714" y2="104" stroke="#57606a" stroke-width="1.5" marker-end="url(#b)"/>
  <text class="t m" x="440" y="96" text-anchor="middle">GET /conversion/book-data/896</text>
  <line x1="720" y1="140" x2="171" y2="140" stroke="#57606a" stroke-width="1.5" marker-end="url(#b)"/>
  <text class="t l" x="440" y="132" text-anchor="middle">input + output formats, available options</text>

  <line x1="165" y1="182" x2="714" y2="182" stroke="#57606a" stroke-width="1.5" marker-end="url(#b)"/>
  <text class="t m" x="440" y="174" text-anchor="middle">POST /conversion/start/896</text>
  <line x1="720" y1="214" x2="171" y2="214" stroke="#57606a" stroke-width="1.5" marker-end="url(#b)"/>
  <text class="t l" x="440" y="206" text-anchor="middle">job_id — the job is queued on the server</text>

  <rect x="200" y="238" width="480" height="62" fill="#fff8c5" stroke="#d4a72c" stroke-width="1.2" rx="6"/>
  <text class="t m" x="440" y="260" text-anchor="middle">GET /conversion/status/{job_id}</text>
  <text class="t l" x="440" y="280" text-anchor="middle">polled with a backoff of 1s to 5s while running is true</text>
  <text class="t l" x="440" y="295" text-anchor="middle">conversion happens here, on the calibre machine</text>

  <line x1="720" y1="326" x2="171" y2="326" stroke="#1a7f37" stroke-width="1.8" marker-end="url(#b)"/>
  <text class="t ok" x="440" y="318" text-anchor="middle">running: false, ok: true, fmt: azw3, size: 4516841</text>

  <text class="t l" x="60" y="366">The server writes the new format into the book itself — nothing is uploaded back.</text>
  <text class="t l" x="60" y="386">So this container needs no calibre and no <tspan class="m">ebook-convert</tspan>.</text>
</svg>
