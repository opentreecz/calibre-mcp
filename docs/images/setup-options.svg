<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 330" width="900" height="330" role="img" aria-label="Three ways to run calibre and the CALIBRE_URL each one needs">
  <style>
    .t{font-family:-apple-system,Segoe UI,Helvetica,Arial,sans-serif}
    .h{font-size:14px;font-weight:600;fill:#1f2328}
    .l{font-size:11.5px;fill:#57606a}
    .m{font-size:11px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;fill:#0a3069}
    .w{font-size:11px;fill:#9a6700}
    .box{fill:#ffffff;stroke:#d0d7de;stroke-width:1.5;rx:8}
  </style>
  <rect width="900" height="330" fill="#f6f8fa"/>
  <text class="t h" x="24" y="30">Three ways to run calibre — all reachable the same way</text>

  <rect class="box" x="24" y="48" width="272" height="216"/>
  <text class="t h" x="44" y="76">A · GUI with its built-in server</text>
  <text class="t l" x="44" y="99">Preferences to Sharing over the net</text>
  <text class="t l" x="44" y="117">Keep the desktop app open.</text>
  <text class="t l" x="44" y="141">CALIBRE_URL</text>
  <text class="t m" x="44" y="159">http://host.docker.internal:8080</text>
  <text class="t w" x="44" y="190">Bind it to 0.0.0.0, not just</text>
  <text class="t w" x="44" y="206">localhost, or the container</text>
  <text class="t w" x="44" y="222">cannot reach it.</text>

  <rect class="box" x="314" y="48" width="272" height="216"/>
  <text class="t h" x="334" y="76">B · standalone calibre-server</text>
  <text class="t l" x="334" y="99">A systemd service, no GUI.</text>
  <text class="t m" x="334" y="121">calibre-server --port 8080 \</text>
  <text class="t m" x="334" y="137">  --listen-on 0.0.0.0 LIB</text>
  <text class="t l" x="334" y="161">CALIBRE_URL</text>
  <text class="t m" x="334" y="179">http://host.docker.internal:8080</text>
  <text class="t w" x="334" y="210">Never run A and B against</text>
  <text class="t w" x="334" y="226">the same library at once.</text>

  <rect class="box" x="604" y="48" width="272" height="216"/>
  <text class="t h" x="624" y="76">C · calibre in Docker</text>
  <text class="t l" x="624" y="99">Both containers on one network.</text>
  <text class="t l" x="624" y="123">CALIBRE_URL</text>
  <text class="t m" x="624" y="141">http://calibre:8080</text>
  <text class="t l" x="624" y="167">Service name, not an IP.</text>
  <text class="t w" x="624" y="198">Drop extra_hosts; put both</text>
  <text class="t w" x="624" y="214">services in the same compose</text>
  <text class="t w" x="624" y="230">file so DNS resolves.</text>

  <text class="t l" x="24" y="294">Every option needs a content server account with write permission —</text>
  <text class="t l" x="24" y="313">"allow unauthenticated local connections" does not apply to a container.</text>
</svg>
